plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

def baritoneVersion = project.baritone_version
def baritoneFile = file("build/deps/baritone-api-fabric-${baritoneVersion}.jar")

dependencies {
	// Minecraft 26.1+ ships unobfuscated (official names), so Loom needs no `mappings` dependency.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// This mod only needs the loader (no Fabric API dependency).
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// MGHttpdProvider's registration API (PathHandler + HttpdProvider.register). compileOnly: the
	// jar must not be bundled, Fabric Loader loads the real one from .minecraft/mods/.
	compileOnly files('libs/httpdprovider-1.0.jar')

	// Baritone's API (IBaritone / ICommandManager / BaritoneAPI). Baritone is a hard runtime
	// dependency declared in fabric.mod.json; its jar must not be bundled either, so compileOnly.
	compileOnly files(baritoneFile)
}

def baritoneUrl =
		"https://github.com/cabaletta/baritone/releases/download/v${baritoneVersion}/baritone-api-fabric-${baritoneVersion}.jar"
def baritoneSha256 = 'eca6e2fdf43c6657fe9fea10a8f9a7572d78dc91ad389b998b808bd28fa5b5d1'

// The official Baritone release is the only source of its API classes. Download the pinned jar
// once into build/deps (which is gitignored) so the repository stays source-only.
tasks.register('downloadBaritone') {
	group = 'build setup'
	description = "Downloads Baritone ${baritoneVersion}'s API jar for compilation."
	outputs.file(baritoneFile)

	doLast {
		if (!baritoneFile.exists()) {
			baritoneFile.parentFile.mkdirs()
			println "downloading ${baritoneUrl}"
			def connection = new URL(baritoneUrl).openConnection()
			connection.instanceFollowRedirects = true
			connection.connectTimeout = 15_000
			connection.readTimeout = 60_000
			baritoneFile.withOutputStream { out ->
				connection.inputStream.withCloseable { input ->
					out << input
				}
			}
		}

		def digest = java.security.MessageDigest.getInstance('SHA-256')
		baritoneFile.withInputStream { input ->
			byte[] buffer = new byte[8192]
			int read
			while ((read = input.read(buffer)) > 0) {
				digest.update(buffer, 0, read)
			}
		}
		def actual = digest.digest().collect { String.format('%02x', it) }.join()
		if (actual != baritoneSha256) {
			throw new GradleException("Baritone jar checksum mismatch: expected ${baritoneSha256}, got ${actual}. "
					+ "Delete ${baritoneFile} and try again.")
		}
	}
}

tasks.named('compileJava') {
	dependsOn 'downloadBaritone'
}

processResources {
	def modVersion = project.version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

// Minecraft 26.1+ is unobfuscated, so there is no remapJar step: the plain jar is loadable.
// If a Loom version does provide remapJar, name it consistently.
tasks.matching { it.name == 'remapJar' }.configureEach {
	archiveFileName = "mgbaritoneconnector-${project.version}.jar"
}
