# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ IDEA / Loom: configuration cache is not supported yet
org.gradle.configuration-cache=false

# Fabric properties (https://fabricmc.net/develop)
# Minecraft 26.1+ is unobfuscated, so no mappings entry is required/used.
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17.21

# Mod properties
version=1.0.0
group=com.example
archives_base_name=mgbaritoneconnector

# Baritone is a runtime dependency (declared in fabric.mod.json). Its API jar is
# compileOnly and is downloaded into build/deps for compilation; it is never bundled.
baritone_version=1.19.0
